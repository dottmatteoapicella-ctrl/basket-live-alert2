
name: Test The Odds API Basket

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa requests
        run: pip install requests

      - name: Test campionati Basket
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python test_odds.py
