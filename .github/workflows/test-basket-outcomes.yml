name: Test basket Telegram outcomes
on:
  push:
    paths:
      - 'basket_alert.py'
      - 'basket_state_crypto.py'
      - 'test_basket_state_crypto.py'
      - 'basket_coverage.py'
      - 'test_basket_coverage.py'
      - 'basket_moviodds.py'
      - 'test_basket_moviodds.py'
      - 'test_basket_team_aliases.py'
      - 'basket_telegram_outcomes.py'
      - 'test_basket_telegram_outcomes.py'
      - '.github/workflows/test-basket-outcomes.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests cryptography
      - run: python -m unittest -v test_basket_telegram_outcomes test_basket_team_aliases test_basket_moviodds test_basket_coverage test_basket_state_crypto
