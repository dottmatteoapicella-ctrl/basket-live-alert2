
name: Basket Live Alert

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basket-live-alert
  cancel-in-progress: false

jobs:
  basket-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa requests
        run: pip install requests

      - name: Esegui bot Basket
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python basket_alert.py

      - name: Salva quote e avvisi
        run: |
          if [ -f basket_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add basket_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna stato Basket"
              git push
            fi
          fi
