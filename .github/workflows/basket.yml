
name: Basket Live Alert

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basket-live-alert
  cancel-in-progress: false

jobs:
  basket-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa requests
        run: pip install requests cryptography

      - name: Esegui bot Basket
        env:
          BASKET_STATE_KEY: ${{ secrets.BASKET_STATE_KEY }}
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
          MOVIODDS_BASKET_ENABLED: ${{ vars.MOVIODDS_BASKET_ENABLED }}
          HOOPS_API_KEY: ${{ secrets.HOOPS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python basket_alert.py

      - name: Salva quote e avvisi cifrati
        if: always()
        run: |
          if [ -f basket_state.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add basket_state.enc
            git rm --ignore-unmatch basket_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna stato Basket"
              git push
            fi
          fi

      - name: Aggiorna consumi API giornalieri e mensili
        if: always()
        shell: bash
        run: |
          if [ -f api_monitor.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase
            python api_usage_rollup.py
            git add api_usage_totals.json
            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna consumi API"
              git push
            fi
          fi

      - name: Archivia monitoraggio API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-monitor-${{ github.run_id }}
          path: api_monitor.json
          if-no-files-found: ignore
          retention-days: 30
